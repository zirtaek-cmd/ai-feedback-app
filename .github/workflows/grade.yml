# 10분마다 채점 대기 제출물을 Gemini 로 채점하고, 문제없는 건은 바로 학생에게 공개한다.
# (교사 페이지를 열어 두지 않아도 동작. 자세한 설정은 README "자동 채점" 절 참고)
#
# 필요한 Secrets (저장소 Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY                 Google AI Studio 키
#   FIREBASE_SERVICE_ACCOUNT_JSON  Firestore 권한만 가진 서비스 계정 키 JSON 전체 내용
# 선택 Variables (같은 화면의 Variables 탭):
#   GEMINI_MODEL   기본 gemini-3.5-flash-lite
#   AUTO_RELEASE   "0" 이면 전부 교사 검토 대기로 둠(기본은 확인 필요 건만 대기)
#   THROTTLE_SEC   건당 대기 초(무료 등급 분당 한도 대응, 기본 5)
#
# 주의: 공개 저장소의 Actions 로그는 누구나 볼 수 있다. grade.py 는 학생 이메일·점수·답안을
#       출력하지 않도록 짜여 있으니, 로그를 더 자세히 찍고 싶어도 그 원칙은 지킬 것.
name: grade

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub 예약은 최소 5분, 혼잡 시 지연될 수 있음
  workflow_dispatch:         # Actions 탭에서 "Run workflow" 로 즉시 실행

permissions:
  contents: read

# 이전 실행이 아직 도는 중이면 겹쳐 돌지 않게 한다(같은 건을 두 번 채점하지 않도록).
concurrency:
  group: grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Grade pending submissions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
          THROTTLE_SEC: ${{ vars.THROTTLE_SEC }}
        run: python grade.py
