# 평일 16:30~02:00, 주말 09:00~02:00(KST)에 5분마다 채점 대기 제출물을 Gemini 로 채점하고,
# 문제없는 건은 바로 학생에게 공개한다. 그 밖의 시간은 교사가 웹 교사 화면에서 직접 채점한다.
# 예약은 일부러 "5분마다 항상"으로 단순하게 둔다. 시간대 판단은 grade.py 의
# ACTIVE_WINDOW / ACTIVE_WINDOW_WEEKEND(KST) 가 하고, 시간대 밖이면 20초 만에 빈 실행으로 끝난다
# (공개 저장소라 비용 없음). 요일·시간 범위가 섞인 cron 은 GitHub 이 등록을 늦추거나 빠뜨리는
# 일이 있어 쓰지 않는다. 시간대를 바꾸려면 변수(또는 grade.py 기본값)만 바꾸면 된다.
# (자세한 설정은 README "자동 채점" 절 참고)
#
# 필요한 Secrets (저장소 Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY                 Google AI Studio 키
#   FIREBASE_SERVICE_ACCOUNT_JSON  Firestore 권한만 가진 서비스 계정 키 JSON 전체 내용
# 선택 Variables (같은 화면의 Variables 탭):
#   GEMINI_MODEL   기본 gemini-3.5-flash-lite
#   AUTO_RELEASE   "0" 이면 전부 교사 검토 대기로 둠(기본은 확인 필요 건만 대기)
#   THROTTLE_SEC   건당 대기 초(무료 등급 분당 한도 대응, 기본 5)
#   ACTIVE_WINDOW          평일 서버 채점 시간대, 기본 "16:30-02:00" (KST, 자정 넘김 가능)
#   ACTIVE_WINDOW_WEEKEND  토·일 서버 채점 시간대, 기본 "09:00-02:00"
#
# 주의: 공개 저장소의 Actions 로그는 누구나 볼 수 있다. grade.py 는 학생 이메일·점수·답안을
#       출력하지 않도록 짜여 있으니, 로그를 더 자세히 찍고 싶어도 그 원칙은 지킬 것.
name: grade

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다(GitHub 최소 간격). 혼잡 시 몇 분 지연될 수 있음
  workflow_dispatch:         # Actions 탭에서 "Run workflow" 로 즉시 실행
    inputs:
      force:
        description: "서버 채점 시간대 밖이어도 지금 채점 (true/false)"
        default: "false"

permissions:
  contents: read

# 이전 실행이 아직 도는 중이면 겹쳐 돌지 않게 한다(같은 건을 두 번 채점하지 않도록).
concurrency:
  group: grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Grade pending submissions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
          THROTTLE_SEC: ${{ vars.THROTTLE_SEC }}
          ACTIVE_WINDOW: ${{ vars.ACTIVE_WINDOW }}
          ACTIVE_WINDOW_WEEKEND: ${{ vars.ACTIVE_WINDOW_WEEKEND }}
          FORCE_RUN: ${{ inputs.force }}
        run: python grade.py
